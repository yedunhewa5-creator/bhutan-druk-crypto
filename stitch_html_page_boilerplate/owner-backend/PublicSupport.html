<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHUTAN DRUK CRYPTO Support</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0f1013;color:#f0f2f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,520px);border:1px solid #2a303c;border-radius:18px;background:#181a1f;padding:24px}h1{margin:0 0 8px;font-size:22px}p{color:#9ca3af;line-height:1.5}form{display:grid;gap:14px;margin-top:20px}label{display:grid;gap:7px;font-size:13px}input,textarea{width:100%;border:1px solid #3a414e;border-radius:9px;padding:12px;background:#0a0a0d;color:#f0f2f5;font:inherit}textarea{min-height:130px;resize:vertical}button{min-height:48px;border:0;border-radius:9px;background:#00ff88;color:#05130b;font:700 15px system-ui,sans-serif;cursor:pointer}button:disabled{opacity:.65;cursor:wait}[hidden]{display:none!important}#result{padding:12px;border-radius:9px;background:#0a0a0d}.trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body><main>
<h1>Contact Support</h1><p>Send your complaint or question. The support team will follow up using the email or WhatsApp details you provide.</p>
<form id="supportForm">
<label>Your name<input name="name" autocomplete="name" maxlength="100" required></label>
<label>Email address<input name="email" type="email" autocomplete="email" maxlength="200" required></label>
<label>WhatsApp number<input name="whatsapp" type="tel" autocomplete="tel" maxlength="40" placeholder="Include country code" required></label>
<label>Subject<input name="subject" maxlength="200" required></label>
<label>Complaint or question<textarea name="message" maxlength="3000" required></textarea></label>
<label class="trap" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
<button id="submitButton" type="submit">Submit support request</button><p id="result" role="status" aria-live="polite" hidden></p>
</form></main>
<script>
const form=document.getElementById('supportForm');const button=document.getElementById('submitButton');const result=document.getElementById('result');
form.addEventListener('submit',event=>{event.preventDefault();if(!window.google||!google.script||!google.script.run){result.hidden=false;result.textContent='Support submission is unavailable in this page. Open the deployed support link.';return}button.disabled=true;result.hidden=true;const payload=Object.fromEntries(new FormData(form));google.script.run.withSuccessHandler(ticket=>{result.hidden=false;result.textContent=ticket.ownerNotified?'Request received. Reference: '+ticket.id+'. The team will contact you using the details you provided.':'Request saved, reference: '+ticket.id+'. The support team email alert failed; please retry later or use the app support contact.';form.reset();button.disabled=false}).withFailureHandler(error=>{result.hidden=false;result.textContent=error&&error.message?error.message:'Could not submit your request. Please try again later.';button.disabled=false}).submitSupportRequest(payload)});
</script></body></html>
